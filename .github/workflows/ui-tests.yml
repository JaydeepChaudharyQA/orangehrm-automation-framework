name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Which TestNG suite to run
        type: choice
        options: [smoke, regression]
        default: regression
      browser:
        description: Browser
        type: choice
        options: [chrome, firefox, edge]
        default: chrome

jobs:
  test:
    name: ${{ inputs.suite || 'regression' }} on ${{ inputs.browser || 'chrome' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests (headless)
        run: >
          ./mvnw -B test
          -Dsuite=${{ inputs.suite || 'regression' }}
          -Dbrowser=${{ inputs.browser || 'chrome' }}
          -Dheadless=true

      - name: Upload reports, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            reports/
            target/surefire-reports/
            logs/
          retention-days: 14
