# ---------------------------------------------------------------
#  Framework configuration
#  Any key can be overridden at run time without editing this file:
#    mvnw test -Dbrowser=firefox -Dheadless=true
#  or with an environment variable (dots become underscores):
#    BROWSER=edge   ADMIN_PASSWORD=...
# ---------------------------------------------------------------

# Application under test (public OrangeHRM demo)
base.url=https://opensource-demo.orangehrmlive.com/web/index.php

# Browser: chrome | firefox | edge
browser=chrome
headless=false

# Synchronisation (seconds). Implicit wait is not used; every wait is explicit.
explicit.wait.seconds=20
page.load.timeout.seconds=60

# Re-run a failed test this many times (protects against a slow shared demo server)
retry.max.count=1

# Public demo credentials, published on the OrangeHRM demo login page.
# Never commit real credentials: pass them as -Dadmin.password=... or ADMIN_PASSWORD instead.
admin.username=Admin
admin.password=admin123
